<div class="container" [class.login-shell]="!auth.autenticado()">
<header>
  <h1 class="brand">
    <picture>
      <source media="(max-width: 600px)" srcset="/assets/logo_chico.svg">
      <img src="/assets/Logo_Grande.svg" alt="World Delivery">
    </picture>
  </h1>
@if(auth.autenticado()) { <div class="session"><span>{{auth.usuario()}}</span><button type="button" (click)="auth.logout()">Cerrar sesión</button></div> }
</header>
@if(auth.error()) { <p class="error" role="alert">{{auth.error()}}</p> }
@if(auth.autenticado()) { <nav aria-label="Navegación principal"><a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
@if(auth.admin()) {
<a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
<a routerLink="/pedidos-inactivos" routerLinkActive="active">Pedidos inactivos</a>
<a routerLink="/rabbit-admin" routerLinkActive="active">Administración RabbitMQ</a> }</nav> }
<main><router-outlet /></main>
</div>
